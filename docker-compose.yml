# ============================================================
# PIPELINE AGENT SECURITY SCANNER - AI HACKFEST 2026
# Target diatur lewat scope-gate/whitelist.json
# JANGAN tambahkan target lain tanpa izin tertulis!
# ============================================================

services:

  hermes-orchestrator:
    image: nousresearch/hermes-agent:latest   # sesuaikan dengan image Hermes dari panitia
    container_name: hermes-orchestrator
    depends_on:
      - scope-gate
    environment:
      - AI_MODEL_ENDPOINT=${AI_MODEL_ENDPOINT}
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
    networks:
      - pipeline-net

  scope-gate:
    build: ./project/service/scope-gate
    container_name: scope-gate
    volumes:
      - ./config/whitelist.json:/app/whitelist.json:ro
    networks:
      - pipeline-net
    ports:
      - "127.0.0.1:5000:5000"

  subdomain-finder:
    build: ./project/service/subdomain-finder
    container_name: subdomain-finder
    volumes:
      - ./config/whitelist.json:/app/whitelist.json:ro
    networks:
      - pipeline-net

  port-scanner:
    build: ./project/service/port-scanner   # wrapper untuk nmap (TCP connect scan, tidak butuh raw socket)
    container_name: port-scanner
    volumes:
      - ./config/whitelist.json:/app/whitelist.json:ro
    networks:
      - pipeline-net

  sqli-tester:
    build: ./project/service/sqli-tester   # deteksi ringan berbasis signature, BUKAN sqlmap
    container_name: sqli-tester
    environment:
      - MODE=detection_only   # satu-satunya mode yang ada, hardcoded di app
    volumes:
      - ./config/whitelist.json:/app/whitelist.json:ro
      - ./config/test_points.json:/app/test_points.json:ro
    networks:
      - pipeline-net

  xss-tester:
    build: ./project/service/xss-tester
    container_name: xss-tester
    environment:
      - MODE=detection_only
    volumes:
      - ./config/whitelist.json:/app/whitelist.json:ro
      - ./config/xss_test_points.json:/app/xss_test_points.json:ro
    networks:
      - pipeline-net

  session-checker:
    build: ./project/service/session-checker
    container_name: session-checker
    volumes:
      - ./config/whitelist.json:/app/whitelist.json:ro
      - ./config/session_test_points.json:/app/session_test_points.json:ro
    networks:
      - pipeline-net

  aggregator:
    build: ./project/service/aggregator
    container_name: aggregator
    networks:
      - pipeline-net

  notifier:
    build: ./project/service/notifier
    container_name: notifier
    env_file:
      - .env
    networks:
      - pipeline-net

  # ------------------------------------------------------------
  # AI model router (opsional) - hemat biaya AI_MODEL_ENDPOINT
  # hermes-orchestrator, sesuai rules poin 2 (tanggung jawab peserta)
  # ------------------------------------------------------------
  9router:
    image: decolua/9router:latest
    container_name: 9router
    volumes:
      - 9router-data:/app/data
    environment:
      - DATA_DIR=/app/data
      - JWT_SECRET=${NINEROUTER_JWT_SECRET}
      - INITIAL_PASSWORD=${NINEROUTER_INITIAL_PASSWORD}
    ports:
      - "127.0.0.1:20128:20128"   # dashboard cuma dari VPS sendiri, akses via SSH tunnel
    networks:
      - pipeline-net

  # ------------------------------------------------------------
  # Target latihan - jalan LOKAL di VPS sendiri, bukan public-facing
  # ------------------------------------------------------------
  dvwa-target:
    image: vulnerables/web-dvwa
    container_name: dvwa-target
    ports:
      - "127.0.0.1:8081:80"   # hanya bisa diakses dari VPS sendiri, tidak terekspos publik
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge

volumes:
  9router-data:
